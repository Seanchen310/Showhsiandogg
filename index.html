<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>修仙小幫狗</title>
<script>
(function(){
  var h=new Date().getHours();
  var t=h<8?'night':h<16?'mist':'ink';
  var bg={night:'#0d0f14',mist:'#E8F1F8',ink:'#F2EDE3'};
  document.documentElement.className=t;
  document.documentElement.style.backgroundColor=bg[t];
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100vw;width:100%;}
html{background:#0d0f14;}html.mist{background:#E8F1F8;}html.ink{background:#F2EDE3;}
body{background:transparent;min-height:100vh;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  transition:background-color 1.4s ease,color 1.4s ease;
  font-family:'Noto Serif TC',-apple-system,sans-serif;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity 1.4s ease;}
.night::before{
  background:
    radial-gradient(ellipse 80% 40% at 50% 100%,rgba(29,158,117,0.04) 0%,transparent 70%),
    radial-gradient(ellipse 60% 30% at 20% 60%,rgba(255,255,255,0.02) 0%,transparent 50%);
}
.mist::before{background-image:radial-gradient(ellipse at 15% 0%,rgba(120,180,220,0.22) 0%,transparent 45%),radial-gradient(ellipse at 85% 100%,rgba(100,160,200,0.18) 0%,transparent 45%);}
.ink::before{background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(139,110,60,0.06) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(139,110,60,0.04) 40px);}
html.night,.night{background-color:#0d0f14;color:#e2e8f0;}
html.mist,.mist{background-color:#E8F1F8;color:#1E3D52;}
html.ink,.ink{background-color:#F2EDE3;color:#3D2B1A;}

/* ── 水墨山水裝飾 ── */
.ink-mountains{position:fixed;bottom:60px;right:0;width:180px;height:160px;pointer-events:none;z-index:0;transition:opacity 1.4s ease;}
.night .ink-mountains{opacity:.05;}
.mist  .ink-mountains{opacity:.06;}
.ink   .ink-mountains{opacity:.08;}

/* ── Header ── */
.header{padding:20px 20px 14px;transition:border-color 1.4s ease;position:relative;z-index:1;}
.night .header{border-bottom:0.5px solid rgba(255,255,255,0.06);}
.mist  .header{border-bottom:0.5px solid #B0CCE0;}
.ink   .header{border-bottom:0.5px solid #C9B99A;}
.hdr-dog{font-size:11px;letter-spacing:.1em;margin-bottom:6px;display:flex;align-items:center;gap:5px;transition:color 1.4s ease;}
.night .hdr-dog{color:#4a5568;}
.mist  .hdr-dog{color:#6090A8;}
.ink   .hdr-dog{color:#9A7A5A;}
.hdr-main{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.hdr-left{}
.site-title{font-size:26px;font-weight:300;letter-spacing:.1em;line-height:1;transition:all 1.4s ease;}
.night .site-title{color:#e2e8f0;}
.mist  .site-title{color:#1E3D52;}
.ink   .site-title{color:#3D2B1A;}
.night .site-title b{font-weight:700;background:linear-gradient(135deg,#fef08a,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.mist  .site-title b{font-weight:700;color:#1E3D52;}
.ink   .site-title b{font-weight:700;color:#3D2B1A;}
.hdr-sub{font-size:11px;letter-spacing:.06em;margin-top:4px;transition:color 1.4s ease;}
.night .hdr-sub{color:#4a5568;}
.mist  .hdr-sub{color:#6090A8;}
.ink   .hdr-sub{color:#9A7A5A;}
/* 吉祥物預留區 */


/* ── Content ── */
.content{padding:0 16px 120px;position:relative;z-index:1;}

/* ── 提醒泡泡 ── */
.reminder{margin:14px 0 0;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:all 1.4s ease;}
.night .reminder{background:rgba(245,158,11,0.06);border:0.5px solid rgba(245,158,11,0.25);}
.mist  .reminder{background:#FEF9E7;border:0.5px solid #D4AC0D;}
.ink   .reminder{background:#FEF9E7;border:0.5px solid #D4AC0D;}
.reminder-pulse{width:7px;height:7px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite;}
.night .reminder-pulse{background:#f59e0b;}
.mist  .reminder-pulse,.ink .reminder-pulse{background:#D4AC0D;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(245,158,11,.4);}50%{opacity:.6;box-shadow:0 0 0 5px rgba(245,158,11,0);}}
.reminder-text{font-size:13px;flex:1;transition:color 1.4s ease;}
.night .reminder-text{color:#d97706;}
.mist  .reminder-text,.ink .reminder-text{color:#7D6608;}
.reminder-num{font-size:10px;padding:1px 7px;border-radius:999px;transition:all 1.4s ease;}
.night .reminder-num{background:rgba(245,158,11,0.15);color:#92400e;}
.mist  .reminder-num,.ink .reminder-num{background:rgba(212,172,13,0.15);color:#7D6608;}
.reminder.hidden{display:none;}

/* ── 卡片通用 ── */
.card{border-radius:16px;padding:14px 16px;margin-top:12px;transition:all 1.4s ease;position:relative;overflow:hidden;}
.night .card{background:rgba(255,255,255,0.025);border:0.5px solid rgba(255,255,255,0.07);}
.mist  .card{background:rgba(250,253,255,0.9);border:.5px solid #C2D8E8;}
.ink   .card{background:rgba(255,251,242,0.88);border:.5px solid #C9B99A;}
.card-label{font-size:10px;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px;transition:color 1.4s ease;}
.card-label::after{content:'';flex:1;height:0.5px;}
.night .card-label{color:#4a5568;}.night .card-label::after{background:rgba(255,255,255,0.05);}
.mist  .card-label{color:#6090A8;}.mist  .card-label::after{background:#C2D8E8;}
.ink   .card-label{color:#9A7A5A;}.ink   .card-label::after{background:#C9B99A;}

/* ── 紀元倒數（半圓時鐘） ── */
.era-semiclock{position:relative;width:220px;height:120px;margin:4px auto 10px;}
.era-semiclock svg{width:100%;height:100%;overflow:visible;}
/* SVG 軌道顏色 */
.night #era-track-arc{stroke:rgba(255,255,255,0.07);}
.mist  #era-track-arc{stroke:rgba(91,163,201,0.18);}
.ink   #era-track-arc{stroke:rgba(192,153,100,0.18);}
/* SVG 進度弧顏色 */
.night #era-prog-arc{stroke:url(#grad-night);}
.mist  #era-prog-arc{stroke:url(#grad-mist);}
.ink   #era-prog-arc{stroke:url(#grad-ink);}
/* 中央文字 */
.era-clock-center{position:absolute;bottom:0;left:0;right:0;text-align:center;}
.era-clock-main{font-size:28px;font-weight:300;line-height:1;font-family:'Noto Serif TC',serif;letter-spacing:.02em;transition:color 1.4s ease;}
.night .era-clock-main{color:#e2e8f0;}
.mist  .era-clock-main{color:#1E3D52;}
.ink   .era-clock-main{color:#3D2B1A;}
.era-clock-sub{font-size:9px;letter-spacing:.1em;margin-top:4px;transition:color 1.4s ease;}
.night .era-clock-sub{color:#4a5568;}
.mist  .era-clock-sub{color:#6090A8;}
.ink   .era-clock-sub{color:#9A7A5A;}
.era-dates{display:flex;justify-content:space-between;margin-top:4px;}
.era-date{font-size:9px;letter-spacing:.04em;transition:color 1.4s ease;}
.night .era-date{color:#374151;}
.mist  .era-date{color:#90B8D0;}
.ink   .era-date{color:#C9B99A;}

/* ── 工具格 ── */
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.tool-tile{border-radius:14px;padding:14px 14px 12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;text-decoration:none;display:block;}
.night .tool-tile{background:rgba(255,255,255,0.025);border:0.5px solid rgba(255,255,255,0.07);}
.mist  .tool-tile{background:rgba(250,253,255,0.9);border:.5px solid #C2D8E8;}
.ink   .tool-tile{background:rgba(255,251,242,0.88);border:.5px solid #C9B99A;}
.night .tool-tile.live::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(29,158,117,0.5),transparent);}
.mist  .tool-tile.live::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(58,168,130,0.5),transparent);}
.ink   .tool-tile.live::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(74,124,63,0.5),transparent);}
.tool-tile.dim{opacity:.3;cursor:default;pointer-events:none;}
.tt-icon{font-size:22px;margin-bottom:8px;}
.tt-name{font-size:13px;font-weight:500;letter-spacing:.04em;margin-bottom:3px;transition:color 1.4s ease;}
.night .tt-name{color:#d1d5db;}
.mist  .tt-name{color:#1E3D52;}
.ink   .tt-name{color:#3D2B1A;}
.tt-desc{font-size:10px;line-height:1.4;transition:color 1.4s ease;}
.night .tt-desc{color:#4a5568;}
.mist  .tt-desc{color:#6090A8;}
.ink   .tt-desc{color:#9A7A5A;}
.tt-arrow{position:absolute;bottom:10px;right:12px;font-size:12px;transition:color 1.4s ease;}
.night .tt-arrow{color:#374151;}
.mist  .tt-arrow{color:#B0CCE0;}
.ink   .tt-arrow{color:#C9B99A;}
.tt-soon{position:absolute;top:10px;right:10px;font-size:9px;padding:2px 6px;border-radius:999px;transition:all 1.4s ease;}
.night .tt-soon{background:rgba(255,255,255,0.05);color:#374151;}
.mist  .tt-soon{background:#E8F1F8;color:#90B8D0;}
.ink   .tt-soon{background:#F2EDE3;color:#C9B99A;}

/* ── 主題切換 ── */
.theme-row{display:flex;gap:8px;}
.theme-opt{flex:1;border-radius:10px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .2s;}
.night .theme-opt{border:0.5px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);}
.mist  .theme-opt{border:.5px solid #C2D8E8;background:rgba(250,253,255,0.7);}
.ink   .theme-opt{border:.5px solid #C9B99A;background:rgba(255,251,242,0.7);}
.night .theme-opt.on{border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.04);}
.mist  .theme-opt.on{border-color:#5BA3C9;background:rgba(91,163,201,0.1);}
.ink   .theme-opt.on{border-color:#B8860B;background:rgba(184,134,11,0.08);}
.to-dot{width:18px;height:18px;border-radius:50%;}
.to-auto{background:conic-gradient(#1a1c23 180deg,#E8F1F8 180deg);border:0.5px solid rgba(255,255,255,0.1);}
.to-name{font-size:9px;letter-spacing:.04em;transition:color 1.4s ease;}
.night .to-name{color:#6b7a99;}
.mist  .to-name{color:#6090A8;}
.ink   .to-name{color:#9A7A5A;}
.night .theme-opt.on .to-name{color:#d97706;}
.mist  .theme-opt.on .to-name{color:#0C447C;}
.ink   .theme-opt.on .to-name{color:#7D6608;}

/* ── Bottom bar ── */
#bottom-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;z-index:100;padding:6px 8px;border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all 1.4s ease;}
.night #bottom-bar{background:rgba(10,14,20,0.92);border:0.5px solid rgba(255,255,255,0.1);}
.mist  #bottom-bar{background:rgba(232,241,248,0.92);border:.5px solid #B0CCE0;}
.ink   #bottom-bar{background:rgba(242,237,227,0.92);border:.5px solid #C9B99A;}
#clock-txt{font-size:11px;font-family:monospace;letter-spacing:.03em;padding:0 6px;white-space:nowrap;transition:color 1.4s ease;}
.night #clock-txt{color:#f59e0b;}
.mist  #clock-txt{color:#1E3D52;}
.ink   #clock-txt{color:#3D2B1A;}
.p-sep{width:0.5px;height:14px;margin:0 4px;transition:background 1.4s ease;}
.night .p-sep{background:rgba(255,255,255,0.08);}
.mist  .p-sep{background:#C2D8E8;}
.ink   .p-sep{background:#C9B99A;}
/* 主題點：單一循環點 */
#theme-cycle{width:10px;height:10px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:all .25s;flex-shrink:0;margin:0 4px;}
.night #theme-cycle{border-color:rgba(245,158,11,0.5);}
.mist  #theme-cycle{border-color:#5BA3C9;}
.ink   #theme-cycle{border-color:#B8860B;}
/* tab */
.p-tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 7px;border-radius:8px;cursor:pointer;text-decoration:none;transition:all .2s;}
.p-tab-icon{font-size:15px;transition:color 1.4s ease;}
.p-tab-label{font-size:8px;white-space:nowrap;transition:color 1.4s ease;}
.night .p-tab-icon,.night .p-tab-label{color:#374151;}
.night .p-tab.on .p-tab-icon,.night .p-tab.on .p-tab-label{color:#f59e0b;}
.mist  .p-tab-icon,.mist  .p-tab-label{color:#90B8D0;}
.mist  .p-tab.on .p-tab-icon,.mist  .p-tab.on .p-tab-label{color:#1E3D52;}
.ink   .p-tab-icon,.ink   .p-tab-label{color:#C9B99A;}
.ink   .p-tab.on .p-tab-icon,.ink   .p-tab.on .p-tab-label{color:#3D2B1A;}
.nav-more{background:none;border:none;cursor:pointer;padding:4px 7px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:1px;}
.nav-more-icon{font-size:15px;transition:color 1.4s ease;}
.nav-more-label{font-size:8px;white-space:nowrap;transition:color 1.4s ease;}
.night .nav-more-icon,.night .nav-more-label{color:#1f2937;}
.mist  .nav-more-icon,.mist  .nav-more-label{color:#C2D8E8;}
.ink   .nav-more-icon,.ink   .nav-more-label{color:#C9B99A;}

/* ── 吉祥物 ── */
#mascot-wrap{position:fixed;left:-10%;bottom:0;width:55vw;max-width:260px;z-index:200;pointer-events:none;transition:opacity 2s ease,transform 2s ease;}
#mascot-wrap.fade-out{opacity:0;transform:translateY(20px);}
#mascot-img{width:100%;display:block;}
#mascot-btn{position:fixed;left:16px;bottom:80px;width:48px;height:48px;border-radius:50%;cursor:pointer;z-index:200;border:none;padding:0;overflow:hidden;opacity:0;transition:opacity .5s ease;background:transparent;}
#mascot-btn.visible{opacity:1;}
#mascot-btn img{width:100%;height:100%;object-fit:cover;object-position:top center;}
</style>
</head>

<script>
const ICONS={night:'☾',mist:'☀',ink:'🌆'};
const BG={night:'#0d0f14',mist:'#E8F1F8',ink:'#F2EDE3'};
const THEME_COLORS={night:'#1a1c23',mist:'#5BA3C9',ink:'#C9B99A'};
let themePref='auto';
let manualOverride=false,manualTimer=null;

function getAutoTheme(){const h=new Date().getHours();return h<8?'night':h<16?'mist':'ink';}
function getTheme(){return document.documentElement.classList.contains('night')?'night':document.documentElement.classList.contains('mist')?'mist':'ink';}

function applyTheme(t){
  ['night','mist','ink'].forEach(c=>{document.documentElement.classList.remove(c);document.body.classList.remove(c);});
  document.documentElement.classList.add(t);document.body.classList.add(t);
  document.body.style.backgroundColor=BG[t];document.documentElement.style.backgroundColor=BG[t];
  updateClock(t);
  updateThemeDot(t);
  updateThemeCards();
}
function updateClock(t){
  const n=new Date(),hh=String(n.getHours()).padStart(2,'0'),mm=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clock-txt').textContent=ICONS[t]+' '+hh+':'+mm;
}
function updateThemeDot(t){
  const dot=document.getElementById('theme-cycle');
  if(dot)dot.style.background=THEME_COLORS[t];
}
function updateThemeCards(){
  const t=getTheme();
  ['auto','night','mist','ink'].forEach(k=>{
    const el=document.getElementById('th-'+k);
    if(el)el.classList.toggle('on',k===themePref);
  });
}
function setThemePref(pref){
  themePref=pref;
  manualOverride=(pref!=='auto');
  if(manualOverride){
    if(manualTimer)clearTimeout(manualTimer);
    manualTimer=setTimeout(()=>{manualOverride=false;themePref='auto';updateThemeCards();},3600000);
    applyTheme(pref);
  } else {
    applyTheme(getAutoTheme());
  }
  updateThemeCards();
}
function cyclePillTheme(){
  const order=['night','mist','ink','auto'];
  const cur=themePref;
  const next=order[(order.indexOf(cur)+1)%order.length];
  setThemePref(next);
}
function checkTime(){
  updateClock(getTheme());
  if(!manualOverride){const a=getAutoTheme();if(a!==getTheme())applyTheme(a);}
  updateReminder();
  updateEra();
}
applyTheme(getAutoTheme());
setInterval(checkTime,30000);

function toMins(h,m){return h*60+m;}
function updateReminder(){
  const now=new Date();
  const cur=toMins(now.getHours(),now.getMinutes());
  // 找最新觸發的（取最後一個符合的）
  let active=null;
  for(const r of REMINDERS){
    const s=toMins(r.start[0],r.start[1]);
    const e=toMins(r.end[0],r.end[1]);
    let inRange=false;
    if(s<=e){inRange=cur>=s&&cur<e;}
    else{inRange=cur>=s||cur<e;} // 跨午夜
    if(inRange)active=r;
  }
  const bar=document.getElementById('reminder-bar');
  if(active){
    document.getElementById('reminder-text').textContent=active.text;
    document.getElementById('reminder-num').textContent='#'+active.id;
    bar.classList.remove('hidden');
  } else {
    bar.classList.add('hidden');
  }
}

// ── 混沌紀元計算 ──
function getChaosEra(){
  const epoch = new Date('2026-05-31T00:00:00+08:00');
  const now = new Date();
  const diffMs = now - epoch;
  const diffDays = Math.floor(diffMs / (1000*60*60*24));
  const era = Math.floor(diffDays / 7) + 1;
  return era;
}
function updateEra(){
  const now=new Date();
  const sat=new Date(now);
  sat.setDate(now.getDate()+(6-now.getDay()));
  sat.setHours(23,59,59,0);
  const sun=new Date(now);
  sun.setDate(now.getDate()-now.getDay());
  sun.setHours(10,0,0,0);
  const total=sat-sun;
  const remain=Math.max(0,sat-now);
  const pct=(1-remain/total); // 0→1，已過比例
  const d=Math.floor(remain/86400000);
  const h=Math.floor((remain%86400000)/3600000);
  const m=Math.floor((remain%3600000)/60000);
  // 大時鐘顯示文字
  const txt=document.getElementById('era-remain-txt');
  if(txt){
    if(d>0) txt.textContent=d+'天 '+h+'時 '+m+'分';
    else     txt.textContent=h+'時 '+m+'分';
  }
  // 半圓進度弧：dasharray=298，dashoffset 從 298（空）→ 0（全滿）
  const arc=document.getElementById('era-prog-arc');
  if(arc){
    const offset=Math.round(298*(1-pct));
    arc.style.strokeDashoffset=offset;
  }
  const era=getChaosEra();
  const el=document.getElementById('era-title');
  if(el)el.textContent='混沌第'+era+'紀元';
}
updateEra();
setInterval(updateEra,60000);
